name: API Functionality CI

on:
  push:
    paths:
      - "api_functionality/**"
      - ".github/workflows/api-functionality-ci.yml"
  pull_request:
    paths:
      - "api_functionality/**"
      - ".github/workflows/api-functionality-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-functionality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_functionality/backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api_functionality/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

  frontend-quality:
    name: Frontend lint, types, and build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_functionality/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api_functionality/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
