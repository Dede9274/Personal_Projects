name: API Functionality CI

on:
  push:
    paths:
      - "api_functionality/**"
      - ".github/workflows/api-functionality-ci.yml"
  pull_request:
    paths:
      - "api_functionality/**"
      - ".github/workflows/api-functionality-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-functionality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend security, notifications, and unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api_functionality/backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api_functionality/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check installed backend dependencies
        run: python -m pip check

      - name: Test SSRF policy and validated redirects
        run: >-
          python -m unittest
          tests.test_url_validator
          tests.test_checker
          tests.test_monitor_service
          tests.test_monitor_router
          -v

      - name: Test notification settings, queues, email, and webhooks
        run: >-
          python -m unittest
          tests.test_notification_channels
          tests.test_notification_config
          tests.test_notification_producer
          tests.test_notification_queue_worker
          tests.test_notification_router
          tests.test_notification_schemas
          tests.test_notification_service
          tests.test_notification_worker
          -v

      - name: Validate Alembic migration chain
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade head --sql > /tmp/api-functionality-migrations.sql
          test -s /tmp/api-functionality-migrations.sql

      - name: Run complete backend unit suite
        run: python -m unittest discover -s tests -v

  backend-integration:
    name: PostgreSQL, Redis, and worker integration (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: uptime_test
          POSTGRES_PASSWORD: uptime_test
          POSTGRES_DB: uptime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime_test -d uptime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api_functionality/backend
    env:
      DATABASE_URL: postgresql+psycopg://uptime_test:uptime_test@localhost:5432/uptime_test
      REDIS_URL: redis://localhost:6379/0
      RUN_DATABASE_TESTS: "1"
      RUN_REDIS_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api_functionality/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run database, Redis, and worker integration tests
        run: >-
          python -m unittest
          tests.test_database_integration
          tests.test_incident_lifecycle
          tests.test_redis_integration
          tests.test_redis_queue_integration
          -v

  compose-validation:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api_functionality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate complete service topology
        run: docker compose config --quiet

  frontend-quality:
    name: Frontend lint, types, and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api_functionality/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api_functionality/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
