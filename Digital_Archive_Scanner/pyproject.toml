[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-archive"
version = "0.1.0"
description = "Local OCR and document-routing service for scanned PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "PyMuPDF",
    "pytesseract",
    "watchdog",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
smart-archive = "smart_archive.cli:main"
smart-archive-watch = "smart_archive.watcher:main"
smart-archive-retry = "smart_archive.watcher:retry_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
